<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Newson Sportec Sky Rider</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, Helvetica, sans-serif;
      overflow-x: hidden;
    }

    .poster-wrapper {
      position: relative;
      width: 100%;
      max-width: 1600px;
      overflow: hidden;
      background: #000;
      cursor: pointer;
    }

    .poster-link {
      display: block;
      position: relative;
      text-decoration: none;
      color: inherit;
    }

    .poster {
      position: relative;
      width: 100%;
      display: block;
      z-index: 1;

      /*
        This makes the website image brighter and closer to the real PNG color.
        You can change 1.15 to 1.2 if you want brighter.
      */
      filter: brightness(1.16) contrast(1.08) saturate(1.18);

      transition: transform 0.8s ease;
    }

    .poster-wrapper:hover .poster {
      transform: scale(1.02);
    }

    /* Moving cloud layer from right to left */
    .cloud-layer {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      overflow: hidden;

      /*
        Lower opacity keeps your original image color accurate.
        If the website still looks too dark, change 0.18 to 0.10.
      */
      opacity: 0.18;
      mix-blend-mode: screen;
    }

    .clouds {
      position: absolute;
      top: 0;
      left: 0;
      width: 220%;
      height: 55%;
      background:
        radial-gradient(circle at 15% 35%, rgba(255,255,255,0.75) 0%, rgba(255,255,255,0.25) 18%, transparent 34%),
        radial-gradient(circle at 35% 30%, rgba(255,255,255,0.65) 0%, rgba(255,255,255,0.20) 20%, transparent 36%),
        radial-gradient(circle at 58% 40%, rgba(255,255,255,0.75) 0%, rgba(255,255,255,0.25) 18%, transparent 34%),
        radial-gradient(circle at 78% 28%, rgba(255,255,255,0.65) 0%, rgba(255,255,255,0.18) 20%, transparent 36%);
      filter: blur(18px);
      animation: moveClouds 28s linear infinite;
    }

    .clouds.second {
      top: 8%;
      opacity: 0.45;
      transform: scale(1.15);
      animation-duration: 42s;
      animation-delay: -12s;
    }

    @keyframes moveClouds {
      from {
        transform: translateX(0);
      }
      to {
        transform: translateX(-50%);
      }
    }

    /* Soft sunlight glow, reduced to keep color accurate */
    .sun-glow {
      position: absolute;
      top: -15%;
      right: -10%;
      width: 55%;
      height: 55%;
      z-index: 3;
      pointer-events: none;
      background: radial-gradient(
        circle,
        rgba(255, 230, 160, 0.16),
        rgba(255, 180, 80, 0.06),
        transparent 65%
      );
      animation: glowPulse 4s ease-in-out infinite alternate;
    }

    @keyframes glowPulse {
      from {
        opacity: 0.20;
      }
      to {
        opacity: 0.38;
      }
    }

    /* Moving dust, reduced so it does not make the image dark */
    .dust-layer {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 200%;
      height: 30%;
      z-index: 4;
      pointer-events: none;
      opacity: 0.18;
      background:
        radial-gradient(circle at 12% 70%, rgba(150, 105, 65, 0.40) 0%, transparent 10%),
        radial-gradient(circle at 28% 62%, rgba(180, 130, 80, 0.28) 0%, transparent 12%),
        radial-gradient(circle at 45% 75%, rgba(120, 85, 55, 0.30) 0%, transparent 10%),
        radial-gradient(circle at 68% 65%, rgba(170, 120, 75, 0.28) 0%, transparent 13%),
        radial-gradient(circle at 85% 78%, rgba(130, 90, 55, 0.30) 0%, transparent 12%);
      filter: blur(8px);
      animation: moveDust 10s linear infinite;
    }

    @keyframes moveDust {
      from {
        transform: translateX(0);
      }
      to {
        transform: translateX(-50%);
      }
    }

    /*
      This cover hides the white "Screenshot" column at the bottom.
      It is placed in the red circled area.
    */
    .screenshot-cover {
      position: absolute;
      left: 23.5%;
      bottom: 0.5%;
      width: 39%;
      height: 13.5%;
      z-index: 15;
      pointer-events: none;

      background: linear-gradient(
        to bottom,
        rgba(232, 220, 195, 0.98),
        rgba(225, 210, 182, 0.98)
      );

      border-top: 3px solid rgba(255, 70, 20, 0.95);
      box-shadow: 0 -8px 20px rgba(130, 80, 40, 0.15);
    }

    /*
      Facebook button moved to the red circled area.
      It now sits on top of the screenshot cover.
    */
    .facebook-button {
      position: absolute;
      left: 37%;
      bottom: 3.6%;
      z-index: 25;

      background: rgba(8, 8, 8, 0.88);
      color: white;

      padding: 13px 28px;
      border-radius: 999px;

      font-size: 20px;
      font-weight: 900;
      letter-spacing: 1.5px;
      text-transform: uppercase;

      border: 2px solid rgba(255, 90, 20, 0.98);
      box-shadow:
        0 0 16px rgba(255, 90, 20, 0.55),
        0 6px 18px rgba(0, 0, 0, 0.35);

      pointer-events: none;
      white-space: nowrap;
    }

    .poster-wrapper:hover .facebook-button {
      background: rgba(255, 95, 25, 0.98);
      color: #111;
    }

    @media (max-width: 768px) {
      .poster-wrapper {
        max-width: 100%;
      }

      .poster {
        filter: brightness(1.18) contrast(1.08) saturate(1.2);
      }

      .cloud-layer {
        opacity: 0.12;
      }

      .screenshot-cover {
        left: 23%;
        bottom: 0.4%;
        width: 40%;
        height: 14%;
      }

      .facebook-button {
        left: 33%;
        bottom: 4%;
        font-size: 12px;
        padding: 9px 16px;
      }
    }
  </style>
</head>

<body>

  <div class="poster-wrapper">

    <a
      class="poster-link"
      href="https://www.facebook.com/Newsonsportecnews"
      target="_blank"
      rel="noopener noreferrer"
      title="Visit Newson Sportec on Facebook"
    >

      <!-- Original image -->
      <img
        src="sky-rider.png"
        alt="Newson Sportec Sky Rider"
        class="poster"
      />

      <!-- Moving clouds -->
      <div class="cloud-layer">
        <div class="clouds"></div>
        <div class="clouds second"></div>
      </div>

      <!-- Sun glow -->
      <div class="sun-glow"></div>

      <!-- Moving dust -->
      <div class="dust-layer"></div>

      <!-- Cover original Screenshot white column -->
      <div class="screenshot-cover"></div>

      <!-- Facebook button moved to red circled area -->
      <div class="facebook-button">
        Follow on Facebook
      </div>

    </a>

  </div>

</body>
</html>
