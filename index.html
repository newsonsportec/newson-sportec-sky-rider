<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Newson Sportec Sky Rider</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, Helvetica, sans-serif;
      overflow-x: hidden;
    }

    .poster-wrapper {
      position: relative;
      width: 100%;
      max-width: 1600px;
      overflow: hidden;
      background: #000;
    }

    .poster {
      width: 100%;
      display: block;
      position: relative;
      z-index: 1;

      /*
        This makes the website image brighter and closer to your original image.
        You can adjust these numbers if needed.
      */
      filter: brightness(1.16) contrast(1.13) saturate(1.18);
      transition: transform 0.8s ease, filter 0.8s ease;
    }

    .poster-wrapper:hover .poster {
      transform: scale(1.015);
      filter: brightness(1.2) contrast(1.15) saturate(1.22);
    }

    /* Moving cloud layer */
    .cloud-layer {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      overflow: hidden;

      /*
        Lower opacity keeps your original image color accurate.
      */
      opacity: 0.22;
      mix-blend-mode: screen;
    }

    .clouds {
      position: absolute;
      top: 0;
      left: 0;
      width: 220%;
      height: 58%;
      background:
        radial-gradient(circle at 15% 35%, rgba(255,255,255,0.65) 0%, rgba(255,255,255,0.20) 18%, transparent 34%),
        radial-gradient(circle at 35% 30%, rgba(255,255,255,0.55) 0%, rgba(255,255,255,0.18) 20%, transparent 36%),
        radial-gradient(circle at 58% 40%, rgba(255,255,255,0.65) 0%, rgba(255,255,255,0.20) 18%, transparent 34%),
        radial-gradient(circle at 78% 28%, rgba(255,255,255,0.55) 0%, rgba(255,255,255,0.16) 20%, transparent 36%);
      filter: blur(16px);
      animation: moveClouds 30s linear infinite;
    }

    .clouds.second {
      top: 8%;
      opacity: 0.5;
      transform: scale(1.12);
      animation-duration: 45s;
      animation-delay: -12s;
    }

    @keyframes moveClouds {
      from {
        transform: translateX(0);
      }

      to {
        transform: translateX(-50%);
      }
    }

    /* Soft sunlight glow */
    .sun-glow {
      position: absolute;
      top: -12%;
      right: -10%;
      width: 52%;
      height: 52%;
      z-index: 3;
      pointer-events: none;
      background: radial-gradient(
        circle,
        rgba(255, 230, 160, 0.20),
        rgba(255, 180, 80, 0.08),
        transparent 65%
      );
      animation: glowPulse 4s ease-in-out infinite alternate;
    }

    @keyframes glowPulse {
      from {
        opacity: 0.25;
      }

      to {
        opacity: 0.55;
      }
    }

    /* Moving dust at bottom */
    .dust-layer {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 200%;
      height: 28%;
      z-index: 4;
      pointer-events: none;
      opacity: 0.22;
      background:
        radial-gradient(circle at 12% 70%, rgba(150, 105, 65, 0.4) 0%, transparent 10%),
        radial-gradient(circle at 28% 62%, rgba(180, 130, 80, 0.3) 0%, transparent 12%),
        radial-gradient(circle at 45% 75%, rgba(120, 85, 55, 0.35) 0%, transparent 10%),
        radial-gradient(circle at 68% 65%, rgba(170, 120, 75, 0.3) 0%, transparent 13%),
        radial-gradient(circle at 85% 78%, rgba(130, 90, 55, 0.35) 0%, transparent 12%);
      filter: blur(8px);
      animation: moveDust 11s linear infinite;
    }

    @keyframes moveDust {
      from {
        transform: translateX(0);
      }

      to {
        transform: translateX(-50%);
      }
    }

    /*
      Big black Facebook column.
      This covers the original white Screenshot column area.
      Only this button is clickable.
    */
    .facebook-button {
      position: absolute;
      left: 39%;
      bottom: 4.6%;
      width: 28%;
      height: 10%;
      z-index: 30;

      display: flex;
      justify-content: center;
      align-items: center;

      background: rgba(0, 0, 0, 0.88);
      color: #ffffff;
      text-decoration: none;

      font-size: clamp(18px, 2.3vw, 38px);
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-align: center;

      border: 4px solid #ff5a1f;
      border-radius: 20px;
      box-shadow:
        0 0 22px rgba(255, 90, 31, 0.65),
        inset 0 0 18px rgba(255, 90, 31, 0.25);

      transition: all 0.3s ease;
    }

    .facebook-button:hover {
      background: #ff5a1f;
      color: #111111;
      transform: scale(1.04);
      box-shadow:
        0 0 35px rgba(255, 90, 31, 0.95),
        inset 0 0 18px rgba(255, 255, 255, 0.25);
    }

    .facebook-button:active {
      transform: scale(0.98);
    }

    @media (max-width: 768px) {
      .poster-wrapper {
        max-width: 100%;
      }

      .cloud-layer {
        opacity: 0.16;
      }

      .facebook-button {
        left: 36%;
        bottom: 4.4%;
        width: 34%;
        height: 10%;
        font-size: clamp(12px, 3vw, 22px);
        border-radius: 12px;
        border-width: 2px;
        letter-spacing: 1px;
      }
    }
  </style>
</head>

<body>

  <div class="poster-wrapper">

    <!-- Your original image. This image is NOT clickable. -->
    <img
      src="sky-rider.png"
      alt="Newson Sportec Sky Rider"
      class="poster"
    />

    <!-- Moving clouds from right to left -->
    <div class="cloud-layer">
      <div class="clouds"></div>
      <div class="clouds second"></div>
    </div>

    <!-- Soft sunlight glow -->
    <div class="sun-glow"></div>

    <!-- Moving dust -->
    <div class="dust-layer"></div>

    <!-- Only this button links to Facebook -->
    <a
      class="facebook-button"
      href="https://www.facebook.com/Newsonsportecnews"
      target="_blank"
      rel="noopener noreferrer"
      title="Follow Newson Sportec on Facebook"
    >
      Follow on Facebook
    </a>

  </div>

</body>
</html>
