<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Newson Sportec Sky Rider</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, Helvetica, sans-serif;
      overflow-x: hidden;
    }

    .poster-wrapper {
      position: relative;
      width: 100%;
      max-width: 1600px;
      overflow: hidden;
      background: #000;
    }

    .poster {
      width: 100%;
      display: block;
      position: relative;
      z-index: 1;
      filter: brightness(1.18) contrast(1.12) saturate(1.18);
      transition: transform 0.8s ease, filter 0.8s ease;
    }

    .poster-wrapper:hover .poster {
      transform: scale(1.01);
      filter: brightness(1.22) contrast(1.14) saturate(1.22);
    }

    /* Moving clouds */
    .cloud-layer {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      overflow: hidden;
      opacity: 0.16;
      mix-blend-mode: screen;
    }

    .clouds {
      position: absolute;
      top: 0;
      left: 0;
      width: 220%;
      height: 58%;
      background:
        radial-gradient(circle at 15% 35%, rgba(255,255,255,0.60) 0%, rgba(255,255,255,0.18) 18%, transparent 34%),
        radial-gradient(circle at 35% 30%, rgba(255,255,255,0.50) 0%, rgba(255,255,255,0.14) 20%, transparent 36%),
        radial-gradient(circle at 58% 40%, rgba(255,255,255,0.60) 0%, rgba(255,255,255,0.18) 18%, transparent 34%),
        radial-gradient(circle at 78% 28%, rgba(255,255,255,0.50) 0%, rgba(255,255,255,0.14) 20%, transparent 36%);
      filter: blur(16px);
      animation: moveClouds 30s linear infinite;
    }

    .clouds.second {
      top: 8%;
      opacity: 0.45;
      transform: scale(1.1);
      animation-duration: 44s;
      animation-delay: -12s;
    }

    @keyframes moveClouds {
      from { transform: translateX(0); }
      to   { transform: translateX(-50%); }
    }

    /* Sun glow */
    .sun-glow {
      position: absolute;
      top: -12%;
      right: -10%;
      width: 52%;
      height: 52%;
      z-index: 3;
      pointer-events: none;
      background: radial-gradient(
        circle,
        rgba(255, 230, 160, 0.18),
        rgba(255, 180, 80, 0.07),
        transparent 65%
      );
      animation: glowPulse 4s ease-in-out infinite alternate;
    }

    @keyframes glowPulse {
      from { opacity: 0.25; }
      to   { opacity: 0.50; }
    }

    /* Base dust */
    .dust-layer {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 200%;
      height: 28%;
      z-index: 4;
      pointer-events: none;
      opacity: 0.22;
      background:
        radial-gradient(circle at 12% 70%, rgba(150, 105, 65, 0.38) 0%, transparent 10%),
        radial-gradient(circle at 28% 62%, rgba(180, 130, 80, 0.28) 0%, transparent 12%),
        radial-gradient(circle at 45% 75%, rgba(120, 85, 55, 0.32) 0%, transparent 10%),
        radial-gradient(circle at 68% 65%, rgba(170, 120, 75, 0.28) 0%, transparent 13%),
        radial-gradient(circle at 85% 78%, rgba(130, 90, 55, 0.32) 0%, transparent 12%);
      filter: blur(8px);
      animation: moveDust 11s linear infinite;
    }

    @keyframes moveDust {
      from { transform: translateX(0); }
      to   { transform: translateX(-50%); }
    }

    /* Strong dust burst */
    .dust-burst {
      position: absolute;
      right: 2%;
      bottom: 4%;
      width: 46%;
      height: 34%;
      z-index: 9;
      pointer-events: none;
      overflow: visible;
    }

    .dust-burst .core {
      position: absolute;
      right: 2%;
      bottom: 2%;
      width: 62%;
      height: 62%;
      background:
        radial-gradient(circle,
          rgba(104, 66, 34, 0.58) 0%,
          rgba(145, 94, 52, 0.42) 26%,
          rgba(187, 132, 82, 0.24) 50%,
          transparent 76%);
      filter: blur(18px);
      animation: coreBlast 1.8s ease-out infinite;
    }

    .dust-burst .core.second {
      right: 8%;
      bottom: 8%;
      width: 44%;
      height: 44%;
      opacity: 0.7;
      animation: coreBlast2 2s ease-out infinite;
    }

    @keyframes coreBlast {
      0% {
        transform: scale(0.55);
        opacity: 0.12;
      }
      25% {
        transform: scale(0.95);
        opacity: 0.48;
      }
      60% {
        transform: scale(1.30);
        opacity: 0.24;
      }
      100% {
        transform: scale(1.60);
        opacity: 0;
      }
    }

    @keyframes coreBlast2 {
      0% {
        transform: scale(0.48);
        opacity: 0.10;
      }
      30% {
        transform: scale(0.92);
        opacity: 0.40;
      }
      70% {
        transform: scale(1.32);
        opacity: 0.18;
      }
      100% {
        transform: scale(1.55);
        opacity: 0;
      }
    }

    /* Stronger dust streaks */
    .dust-streak,
    .dust-streak2,
    .dust-streak3 {
      position: absolute;
      border-radius: 50%;
      filter: blur(10px);
      opacity: 0;
    }

    .dust-streak {
      right: 5%;
      bottom: 16%;
      width: 60%;
      height: 18%;
      background:
        linear-gradient(135deg,
          rgba(190, 140, 90, 0.00) 0%,
          rgba(190, 140, 90, 0.15) 26%,
          rgba(135, 88, 48, 0.34) 56%,
          rgba(110, 70, 38, 0.00) 100%);
      transform: rotate(-18deg);
      animation: streakMove1 1.9s ease-out infinite;
    }

    .dust-streak2 {
      right: 9%;
      bottom: 18%;
      width: 48%;
      height: 14%;
      background:
        linear-gradient(135deg,
          rgba(190, 140, 90, 0.00) 0%,
          rgba(190, 140, 90, 0.12) 25%,
          rgba(120, 78, 42, 0.30) 54%,
          rgba(110, 70, 38, 0.00) 100%);
      transform: rotate(-28deg);
      animation: streakMove2 1.7s ease-out infinite 0.15s;
    }

    .dust-streak3 {
      right: 12%;
      bottom: 11%;
      width: 42%;
      height: 13%;
      background:
        linear-gradient(135deg,
          rgba(190, 140, 90, 0.00) 0%,
          rgba(190, 140, 90, 0.10) 20%,
          rgba(120, 78, 42, 0.26) 52%,
          rgba(110, 70, 38, 0.00) 100%);
      transform: rotate(-8deg);
      animation: streakMove3 2s ease-out infinite 0.25s;
    }

    @keyframes streakMove1 {
      0%   { transform: translateX(0) rotate(-18deg) scaleX(0.75); opacity: 0.08; }
      35%  { transform: translateX(-12px) rotate(-18deg) scaleX(1.00); opacity: 0.42; }
      100% { transform: translateX(-52px) rotate(-18deg) scaleX(1.32); opacity: 0; }
    }

    @keyframes streakMove2 {
      0%   { transform: translateX(0) rotate(-28deg) scaleX(0.80); opacity: 0.08; }
      40%  { transform: translateX(-18px) rotate(-28deg) scaleX(1.02); opacity: 0.38; }
      100% { transform: translateX(-58px) rotate(-28deg) scaleX(1.25); opacity: 0; }
    }

    @keyframes streakMove3 {
      0%   { transform: translateX(0) rotate(-8deg) scaleX(0.75); opacity: 0.06; }
      35%  { transform: translateX(-8px) rotate(-8deg) scaleX(1.00); opacity: 0.35; }
      100% { transform: translateX(-44px) rotate(-8deg) scaleX(1.22); opacity: 0; }
    }

    /* Dust particles */
    .dust-piece {
      position: absolute;
      bottom: 10%;
      right: 12%;
      width: 20px;
      height: 14px;
      background: rgba(115, 74, 40, 0.65);
      border-radius: 45% 55% 52% 48%;
      filter: blur(0.8px);
      opacity: 0;
      transform-origin: center center;
    }

    .dust-piece::before {
      content: "";
      position: absolute;
      inset: -45%;
      border-radius: 50%;
      background: rgba(191, 137, 84, 0.24);
      filter: blur(8px);
    }

    .small  { width: 12px; height: 9px; }
    .medium { width: 20px; height: 14px; }
    .large  { width: 30px; height: 20px; }

    .p1  { animation: split1  1.85s linear infinite; }
    .p2  { animation: split2  1.95s linear infinite 0.08s; }
    .p3  { animation: split3  1.80s linear infinite 0.15s; }
    .p4  { animation: split4  1.90s linear infinite 0.05s; }
    .p5  { animation: split5  2.00s linear infinite 0.12s; }
    .p6  { animation: split6  1.88s linear infinite 0.20s; }
    .p7  { animation: split7  2.10s linear infinite 0.10s; }
    .p8  { animation: split8  1.92s linear infinite 0.18s; }
    .p9  { animation: split9  2.05s linear infinite 0.06s; }
    .p10 { animation: split10 1.84s linear infinite 0.16s; }
    .p11 { animation: split11 2.00s linear infinite 0.24s; }
    .p12 { animation: split12 1.96s linear infinite 0.03s; }
    .p13 { animation: split13 2.08s linear infinite 0.09s; }
    .p14 { animation: split14 1.90s linear infinite 0.14s; }
    .p15 { animation: split15 2.12s linear infinite 0.21s; }
    .p16 { animation: split16 1.86s linear infinite 0.07s; }
    .p17 { animation: split17 2.04s linear infinite 0.11s; }
    .p18 { animation: split18 1.98s linear infinite 0.17s; }
    .p19 { animation: split19 2.15s linear infinite 0.05s; }
    .p20 { animation: split20 1.93s linear infinite 0.19s; }
    .p21 { animation: split21 2.18s linear infinite 0.13s; }
    .p22 { animation: split22 1.87s linear infinite 0.22s; }
    .p23 { animation: split23 2.06s linear infinite 0.04s; }
    .p24 { animation: split24 1.94s linear infinite 0.18s; }

    @keyframes split1  { 0% { transform: translate(0,0) scale(0.35) rotate(0deg); opacity: 0; } 8% { opacity: 0.95; } 100% { transform: translate(-210px,-120px) scale(1.25) rotate(-35deg); opacity: 0; } }
    @keyframes split2  { 0% { transform: translate(0,0) scale(0.30) rotate(0deg); opacity: 0; } 8% { opacity: 0.92; } 100% { transform: translate(-170px,-175px) scale(1.10) rotate(30deg); opacity: 0; } }
    @keyframes split3  { 0% { transform: translate(0,0) scale(0.45) rotate(0deg); opacity: 0; } 8% { opacity: 0.88; } 100% { transform: translate(-110px,-95px) scale(1.35) rotate(-16deg); opacity: 0; } }
    @keyframes split4  { 0% { transform: translate(0,0) scale(0.42) rotate(0deg); opacity: 0; } 8% { opacity: 0.94; } 100% { transform: translate(-250px,-60px) scale(1.20) rotate(26deg); opacity: 0; } }
    @keyframes split5  { 0% { transform: translate(0,0) scale(0.36) rotate(0deg); opacity: 0; } 8% { opacity: 0.90; } 100% { transform: translate(-280px,-150px) scale(1.22) rotate(-28deg); opacity: 0; } }
    @keyframes split6  { 0% { transform: translate(0,0) scale(0.32) rotate(0deg); opacity: 0; } 8% { opacity: 0.90; } 100% { transform: translate(-135px,-52px) scale(1.05) rotate(34deg); opacity: 0; } }
    @keyframes split7  { 0% { transform: translate(0,0) scale(0.40) rotate(0deg); opacity: 0; } 8% { opacity: 0.96; } 100% { transform: translate(-330px,-175px) scale(1.50) rotate(-30deg); opacity: 0; } }
    @keyframes split8  { 0% { transform: translate(0,0) scale(0.38) rotate(0deg); opacity: 0; } 8% { opacity: 0.84; } 100% { transform: translate(-180px,-200px) scale(1.10) rotate(18deg); opacity: 0; } }
    @keyframes split9  { 0% { transform: translate(0,0) scale(0.34) rotate(0deg); opacity: 0; } 8% { opacity: 0.95; } 100% { transform: translate(-295px,-90px) scale(1.18) rotate(-18deg); opacity: 0; } }
    @keyframes split10 { 0% { transform: translate(0,0) scale(0.36) rotate(0deg); opacity: 0; } 8% { opacity: 0.88; } 100% { transform: translate(-122px,-135px) scale(1.02) rotate(16deg); opacity: 0; } }
    @keyframes split11 { 0% { transform: translate(0,0) scale(0.33) rotate(0deg); opacity: 0; } 8% { opacity: 0.93; } 100% { transform: translate(-240px,-190px) scale(1.38) rotate(-24deg); opacity: 0; } }
    @keyframes split12 { 0% { transform: translate(0,0) scale(0.39) rotate(0deg); opacity: 0; } 8% { opacity: 0.90; } 100% { transform: translate(-355px,-72px) scale(1.20) rotate(24deg); opacity: 0; } }
    @keyframes split13 { 0% { transform: translate(0,0) scale(0.30) rotate(0deg); opacity: 0; } 8% { opacity: 0.82; } 100% { transform: translate(-205px,-228px) scale(1.12) rotate(-10deg); opacity: 0; } }
    @keyframes split14 { 0% { transform: translate(0,0) scale(0.48) rotate(0deg); opacity: 0; } 8% { opacity: 0.96; } 100% { transform: translate(-95px,-70px) scale(1.45) rotate(20deg); opacity: 0; } }
    @keyframes split15 { 0% { transform: translate(0,0) scale(0.37) rotate(0deg); opacity: 0; } 8% { opacity: 0.92; } 100% { transform: translate(-380px,-160px) scale(1.35) rotate(-34deg); opacity: 0; } }
    @keyframes split16 { 0% { transform: translate(0,0) scale(0.31) rotate(0deg); opacity: 0; } 8% { opacity: 0.88; } 100% { transform: translate(-150px,-30px) scale(1.08) rotate(30deg); opacity: 0; } }
    @keyframes split17 { 0% { transform: translate(0,0) scale(0.44) rotate(0deg); opacity: 0; } 8% { opacity: 0.95; } 100% { transform: translate(-270px,-132px) scale(1.28) rotate(-14deg); opacity: 0; } }
    @keyframes split18 { 0% { transform: translate(0,0) scale(0.34) rotate(0deg); opacity: 0; } 8% { opacity: 0.85; } 100% { transform: translate(-210px,-88px) scale(1.12) rotate(22deg); opacity: 0; } }
    @keyframes split19 { 0% { transform: translate(0,0) scale(0.42) rotate(0deg); opacity: 0; } 8% { opacity: 0.97; } 100% { transform: translate(-410px,-205px) scale(1.48) rotate(-26deg); opacity: 0; } }
    @keyframes split20 { 0% { transform: translate(0,0) scale(0.36) rotate(0deg); opacity: 0; } 8% { opacity: 0.91; } 100% { transform: translate(-165px,-118px) scale(1.15) rotate(10deg); opacity: 0; } }
    @keyframes split21 { 0% { transform: translate(0,0) scale(0.40) rotate(0deg); opacity: 0; } 8% { opacity: 0.95; } 100% { transform: translate(-445px,-122px) scale(1.42) rotate(-20deg); opacity: 0; } }
    @keyframes split22 { 0% { transform: translate(0,0) scale(0.28) rotate(0deg); opacity: 0; } 8% { opacity: 0.84; } 100% { transform: translate(-132px,-185px) scale(1.04) rotate(26deg); opacity: 0; } }
    @keyframes split23 { 0% { transform: translate(0,0) scale(0.46) rotate(0deg); opacity: 0; } 8% { opacity: 0.96; } 100% { transform: translate(-320px,-95px) scale(1.36) rotate(-18deg); opacity: 0; } }
    @keyframes split24 { 0% { transform: translate(0,0) scale(0.35) rotate(0deg); opacity: 0; } 8% { opacity: 0.90; } 100% { transform: translate(-220px,-245px) scale(1.16) rotate(14deg); opacity: 0; } }

    /* Tiny dust dots */
    .micro-dust {
      position: absolute;
      bottom: 12%;
      right: 10%;
      width: 6px;
      height: 6px;
      background: rgba(170, 120, 72, 0.78);
      border-radius: 50%;
      filter: blur(0.5px);
      opacity: 0;
    }

    .m1  { animation: micro1  1.6s linear infinite 0.05s; }
    .m2  { animation: micro2  1.7s linear infinite 0.10s; }
    .m3  { animation: micro3  1.8s linear infinite 0.15s; }
    .m4  { animation: micro4  1.65s linear infinite 0.02s; }
    .m5  { animation: micro5  1.75s linear infinite 0.08s; }
    .m6  { animation: micro6  1.7s linear infinite 0.14s; }
    .m7  { animation: micro7  1.85s linear infinite 0.04s; }
    .m8  { animation: micro8  1.72s linear infinite 0.12s; }
    .m9  { animation: micro9  1.68s linear infinite 0.06s; }
    .m10 { animation: micro10 1.78s linear infinite 0.11s; }
    .m11 { animation: micro11 1.74s linear infinite 0.09s; }
    .m12 { animation: micro12 1.82s linear infinite 0.03s; }

    @keyframes micro1  { 0% { transform: translate(0,0) scale(0.4); opacity: 0; } 12% { opacity: 0.85; } 100% { transform: translate(-120px,-55px) scale(1.3); opacity: 0; } }
    @keyframes micro2  { 0% { transform: translate(0,0) scale(0.4); opacity: 0; } 12% { opacity: 0.85; } 100% { transform: translate(-160px,-110px) scale(1.2); opacity: 0; } }
    @keyframes micro3  { 0% { transform: translate(0,0) scale(0.4); opacity: 0; } 12% { opacity: 0.85; } 100% { transform: translate(-190px,-70px) scale(1.2); opacity: 0; } }
    @keyframes micro4  { 0% { transform: translate(0,0) scale(0.4); opacity: 0; } 12% { opacity: 0.85; } 100% { transform: translate(-90px,-145px) scale(1.4); opacity: 0; } }
    @keyframes micro5  { 0% { transform: translate(0,0) scale(0.4); opacity: 0; } 12% { opacity: 0.85; } 100% { transform: translate(-230px,-135px) scale(1.3); opacity: 0; } }
    @keyframes micro6  { 0% { transform: translate(0,0) scale(0.4); opacity: 0; } 12% { opacity: 0.85; } 100% { transform: translate(-145px,-40px) scale(1.2); opacity: 0; } }
    @keyframes micro7  { 0% { transform: translate(0,0) scale(0.4); opacity: 0; } 12% { opacity: 0.85; } 100% { transform: translate(-275px,-120px) scale(1.4); opacity: 0; } }
    @keyframes micro8  { 0% { transform: translate(0,0) scale(0.4); opacity: 0; } 12% { opacity: 0.85; } 100% { transform: translate(-185px,-165px) scale(1.3); opacity: 0; } }
    @keyframes micro9  { 0% { transform: translate(0,0) scale(0.4); opacity: 0; } 12% { opacity: 0.85; } 100% { transform: translate(-210px,-92px) scale(1.3); opacity: 0; } }
    @keyframes micro10 { 0% { transform: translate(0,0) scale(0.4); opacity: 0; } 12% { opacity: 0.85; } 100% { transform: translate(-115px,-85px) scale(1.2); opacity: 0; } }
    @keyframes micro11 { 0% { transform: translate(0,0) scale(0.4); opacity: 0; } 12% { opacity: 0.85; } 100% { transform: translate(-245px,-55px) scale(1.2); opacity: 0; } }
    @keyframes micro12 { 0% { transform: translate(0,0) scale(0.4); opacity: 0; } 12% { opacity: 0.85; } 100% { transform: translate(-300px,-155px) scale(1.4); opacity: 0; } }

    /* Facebook button */
    .facebook-button {
      position: absolute;
      left: 27%;
      bottom: 0.9%;
      width: 38%;
      height: 10.5%;
      z-index: 30;
      display: flex;
      justify-content: center;
      align-items: center;
      background: rgba(0, 0, 0, 0.90);
      color: #ffffff;
      text-decoration: none;
      text-align: center;
      text-transform: uppercase;
      font-weight: 900;
      letter-spacing: 2px;
      line-height: 1.1;
      font-size: clamp(20px, 2.2vw, 40px);
      border: 4px solid #ff5a1f;
      border-radius: 24px;
      box-shadow:
        0 0 24px rgba(255, 90, 31, 0.60),
        inset 0 0 14px rgba(255, 90, 31, 0.20);
      transition: all 0.3s ease;
    }

    .facebook-button:hover {
      background: #ff5a1f;
      color: #111;
      transform: scale(1.03);
      box-shadow:
        0 0 30px rgba(255, 90, 31, 0.90),
        inset 0 0 14px rgba(255, 255, 255, 0.18);
    }

    .facebook-button:active {
      transform: scale(0.98);
    }

    @media (max-width: 768px) {
      .cloud-layer {
        opacity: 0.12;
      }

      .dust-burst {
        right: 0%;
        bottom: 5%;
        width: 50%;
        height: 30%;
      }

      .facebook-button {
        left: 26%;
        bottom: 1.0%;
        width: 42%;
        height: 10%;
        font-size: clamp(11px, 2.8vw, 20px);
        border-width: 2px;
        border-radius: 14px;
        letter-spacing: 1px;
      }
    }

  <div class="poster-wrapper">

      alt="Newson Sportec Sky Rider"

    <!-- Clouds -->
    <div class="cloud-layer">

    <!-- Strong dust burst -->

    <!-- Facebook button -->
    <a

      target="_blank"
