<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Newson Sportec Sky Rider</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, Helvetica, sans-serif;
      overflow-x: hidden;
    }

    .poster-wrapper {
      position: relative;
      width: 100%;
      max-width: 1600px;
      overflow: hidden;
      background: #000;
      cursor: pointer;
    }

    .poster-link {
      display: block;
      position: relative;
      text-decoration: none;
      color: inherit;
    }

    .poster {
      position: relative;
      width: 100%;
      display: block;
      z-index: 1;
      transition: transform 0.8s ease;
    }

    .poster-wrapper:hover .poster {
      transform: scale(1.02);
    }

    /* Moving cloud layer */
    .cloud-layer {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      overflow: hidden;
      opacity: 0.45;
      mix-blend-mode: screen;
    }

    .clouds {
      position: absolute;
      top: 0;
      left: 0;
      width: 220%;
      height: 55%;
      background:
        radial-gradient(circle at 15% 35%, rgba(255,255,255,0.75) 0%, rgba(255,255,255,0.25) 18%, transparent 34%),
        radial-gradient(circle at 35% 30%, rgba(255,255,255,0.65) 0%, rgba(255,255,255,0.20) 20%, transparent 36%),
        radial-gradient(circle at 58% 40%, rgba(255,255,255,0.75) 0%, rgba(255,255,255,0.25) 18%, transparent 34%),
        radial-gradient(circle at 78% 28%, rgba(255,255,255,0.65) 0%, rgba(255,255,255,0.18) 20%, transparent 36%);
      filter: blur(18px);
      animation: moveClouds 28s linear infinite;
    }

    .clouds.second {
      top: 8%;
      opacity: 0.55;
      transform: scale(1.15);
      animation-duration: 42s;
      animation-delay: -12s;
    }

    @keyframes moveClouds {
      from {
        transform: translateX(0);
      }
      to {
        transform: translateX(-50%);
      }
    }

    /* Soft sunlight glow */
    .sun-glow {
      position: absolute;
      top: -15%;
      right: -10%;
      width: 55%;
      height: 55%;
      z-index: 3;
      pointer-events: none;
      background: radial-gradient(
        circle,
        rgba(255, 230, 160, 0.35),
        rgba(255, 180, 80, 0.12),
        transparent 65%
      );
      animation: glowPulse 4s ease-in-out infinite alternate;
    }

    @keyframes glowPulse {
      from {
        opacity: 0.35;
      }
      to {
        opacity: 0.7;
      }
    }

    /* Moving dust at bottom */
    .dust-layer {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 200%;
      height: 30%;
      z-index: 4;
      pointer-events: none;
      opacity: 0.35;
      background:
        radial-gradient(circle at 12% 70%, rgba(150, 105, 65, 0.45) 0%, transparent 10%),
        radial-gradient(circle at 28% 62%, rgba(180, 130, 80, 0.35) 0%, transparent 12%),
        radial-gradient(circle at 45% 75%, rgba(120, 85, 55, 0.42) 0%, transparent 10%),
        radial-gradient(circle at 68% 65%, rgba(170, 120, 75, 0.35) 0%, transparent 13%),
        radial-gradient(circle at 85% 78%, rgba(130, 90, 55, 0.4) 0%, transparent 12%);
      filter: blur(10px);
      animation: moveDust 10s linear infinite;
    }

    @keyframes moveDust {
      from {
        transform: translateX(0);
      }
      to {
        transform: translateX(-50%);
      }
    }

    /*
      This box hides the word "Screenshot" at the bottom center.
      You can adjust width, height, bottom, or left if needed.
    */
    .screenshot-cover {
      position: absolute;
      left: 50%;
      bottom: 0.5%;
      transform: translateX(-50%);
      width: 22%;
      height: 9%;
      z-index: 10;
      pointer-events: none;
      background: linear-gradient(
        to bottom,
        rgba(236, 225, 204, 0.96),
        rgba(231, 220, 198, 0.98)
      );
      border-radius: 28px 28px 0 0;
      filter: blur(0.2px);
    }

    /* Facebook button */
    .facebook-button {
      position: absolute;
      right: 4%;
      bottom: 5%;
      z-index: 20;
      background: rgba(0, 0, 0, 0.78);
      color: white;
      padding: 14px 22px;
      border-radius: 999px;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      border: 2px solid rgba(255, 105, 30, 0.95);
      box-shadow: 0 0 18px rgba(255, 105, 30, 0.45);
      pointer-events: none;
    }

    .poster-wrapper:hover .facebook-button {
      background: rgba(255, 105, 30, 0.95);
      color: #111;
    }

    @media (max-width: 768px) {
      .poster-wrapper {
        max-width: 100%;
      }

      .cloud-layer {
        opacity: 0.35;
      }

      .facebook-button {
        font-size: 12px;
        padding: 9px 14px;
      }

      .screenshot-cover {
        width: 25%;
        height: 9%;
        bottom: 0.3%;
      }
    }
  </style>
</head>

<body>

  <div class="poster-wrapper">

    <a
      class="poster-link"
      href="https://www.facebook.com/Newsonsportecnews"
      target="_blank"
      rel="noopener noreferrer"
      title="Visit Newson Sportec on Facebook"
    >

      <!-- Your original image -->
      <img
        src="sky-rider.png"
        alt="Newson Sportec Sky Rider"
        class="poster"
      />

      <!-- Moving clouds -->
      <div class="cloud-layer">
        <div class="clouds"></div>
        <div class="clouds second"></div>
      </div>

      <!-- Sun glow -->
      <div class="sun-glow"></div>

      <!-- Moving dust -->
      <div class="dust-layer"></div>

      <!-- Cover the unwanted Screenshot label -->
      <div class="screenshot-cover"></div>

      <!-- Facebook link button -->
      <div class="facebook-button">
        Follow on Facebook
      </div>

    </a>

  </div>

</body>
</html>
