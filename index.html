<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Newson Sportec Sky Rider</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, Helvetica, sans-serif;
      overflow-x: hidden;
    }

    .poster-wrapper {
      position: relative;
      width: 100%;
      max-width: 1600px;
      overflow: hidden;
      background: #000;
    }

    .poster {
      width: 100%;
      display: block;
      position: relative;
      z-index: 1;
      filter: brightness(1.18) contrast(1.12) saturate(1.18);
      transition: transform 0.8s ease, filter 0.8s ease;
    }

    .poster-wrapper:hover .poster {
      transform: scale(1.01);
      filter: brightness(1.22) contrast(1.14) saturate(1.22);
    }

    /* Moving cloud layer */
    .cloud-layer {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      overflow: hidden;
      opacity: 0.16;
      mix-blend-mode: screen;
    }

    .clouds {
      position: absolute;
      top: 0;
      left: 0;
      width: 220%;
      height: 58%;
      background:
        radial-gradient(circle at 15% 35%, rgba(255,255,255,0.60) 0%, rgba(255,255,255,0.18) 18%, transparent 34%),
        radial-gradient(circle at 35% 30%, rgba(255,255,255,0.50) 0%, rgba(255,255,255,0.14) 20%, transparent 36%),
        radial-gradient(circle at 58% 40%, rgba(255,255,255,0.60) 0%, rgba(255,255,255,0.18) 18%, transparent 34%),
        radial-gradient(circle at 78% 28%, rgba(255,255,255,0.50) 0%, rgba(255,255,255,0.14) 20%, transparent 36%);
      filter: blur(16px);
      animation: moveClouds 30s linear infinite;
    }

    .clouds.second {
      top: 8%;
      opacity: 0.45;
      transform: scale(1.1);
      animation-duration: 44s;
      animation-delay: -12s;
    }

    @keyframes moveClouds {
      from {
        transform: translateX(0);
      }
      to {
        transform: translateX(-50%);
      }
    }

    /* Soft sunlight glow */
    .sun-glow {
      position: absolute;
      top: -12%;
      right: -10%;
      width: 52%;
      height: 52%;
      z-index: 3;
      pointer-events: none;
      background: radial-gradient(
        circle,
        rgba(255, 230, 160, 0.18),
        rgba(255, 180, 80, 0.07),
        transparent 65%
      );
      animation: glowPulse 4s ease-in-out infinite alternate;
    }

    @keyframes glowPulse {
      from {
        opacity: 0.25;
      }
      to {
        opacity: 0.50;
      }
    }

    /* Moving dust */
    .dust-layer {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 200%;
      height: 28%;
      z-index: 4;
      pointer-events: none;
      opacity: 0.20;
      background:
        radial-gradient(circle at 12% 70%, rgba(150, 105, 65, 0.38) 0%, transparent 10%),
        radial-gradient(circle at 28% 62%, rgba(180, 130, 80, 0.28) 0%, transparent 12%),
        radial-gradient(circle at 45% 75%, rgba(120, 85, 55, 0.32) 0%, transparent 10%),
        radial-gradient(circle at 68% 65%, rgba(170, 120, 75, 0.28) 0%, transparent 13%),
        radial-gradient(circle at 85% 78%, rgba(130, 90, 55, 0.32) 0%, transparent 12%);
      filter: blur(8px);
      animation: moveDust 11s linear infinite;
    }

    @keyframes moveDust {
      from {
        transform: translateX(0);
      }
      to {
        transform: translateX(-50%);
      }
    }

    /*
      Facebook button moved to the red-arrow area.
      It covers the circled Screenshot area.
      Only this button is clickable.
    */
    .facebook-button {
      position: absolute;
      left: 27%;
      bottom: 0.9%;
      width: 38%;
      height: 10.5%;
      z-index: 30;

      display: flex;
      justify-content: center;
      align-items: center;

      background: rgba(0, 0, 0, 0.90);
      color: #ffffff;
      text-decoration: none;
      text-align: center;
      text-transform: uppercase;
      font-weight: 900;
      letter-spacing: 2px;
      line-height: 1.1;
      font-size: clamp(20px, 2.2vw, 40px);

      border: 4px solid #ff5a1f;
      border-radius: 24px;

      box-shadow:
        0 0 24px rgba(255, 90, 31, 0.60),
        inset 0 0 14px rgba(255, 90, 31, 0.20);

      transition: all 0.3s ease;
    }

    .facebook-button:hover {
      background: #ff5a1f;
      color: #111;
      transform: scale(1.03);
      box-shadow:
        0 0 30px rgba(255, 90, 31, 0.90),
        inset 0 0 14px rgba(255, 255, 255, 0.18);
    }

    .facebook-button:active {
      transform: scale(0.98);
    }

    @media (max-width: 768px) {
      .cloud-layer {
        opacity: 0.12;
      }

      .facebook-button {
        left: 26%;
        bottom: 1.0%;
        width: 42%;
        height: 10%;
        font-size: clamp(11px, 2.8vw, 20px);
        border-width: 2px;
        border-radius: 14px;
        letter-spacing: 1px;
      }
    }
  </style>
</head>
<body>

  <div class="poster-wrapper">

    <!-- Main image -->
    <img
      src="sky-rider.png"
      alt="Newson Sportec Sky Rider"
      class="poster"
    />

    <!-- Moving clouds -->
    <div class="cloud-layer">
      <div class="clouds"></div>
      <div class="clouds second"></div>
    </div>

    <!-- Sun glow -->
    <div class="sun-glow"></div>

    <!-- Dust effect -->
    <div class="dust-layer"></div>

    <!-- Only this button links to Facebook -->
    <a
      class="facebook-button"
      href="https://www.facebook.com/Newsonsportecnews"
      target="_blank"
      rel="noopener noreferrer"
      title="Follow Newson Sportec on Facebook"
    >
      FOLLOW ON<br>FACEBOOK
    </a>

  </div>

</body>
</html>
