 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Newson Sportec Sky Rider</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, Helvetica, sans-serif;
      overflow-x: hidden;
    }

    .poster-wrapper {
      position: relative;
      width: 100%;
      max-width: 1600px;
      overflow: hidden;
      background: #000;
    }

    .poster {
      width: 100%;
      display: block;
      position: relative;
      z-index: 1;
      filter: brightness(1.18) contrast(1.12) saturate(1.18);
      transition: transform 0.8s ease, filter 0.8s ease;
    }

    .poster-wrapper:hover .poster {
      transform: scale(1.01);
      filter: brightness(1.22) contrast(1.14) saturate(1.22);
    }

    /* =========================
       Moving cloud layer
    ========================= */
    .cloud-layer {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      overflow: hidden;
      opacity: 0.16;
      mix-blend-mode: screen;
    }

    .clouds {
      position: absolute;
      top: 0;
      left: 0;
      width: 220%;
      height: 58%;
      background:
        radial-gradient(circle at 15% 35%, rgba(255,255,255,0.60) 0%, rgba(255,255,255,0.18) 18%, transparent 34%),
        radial-gradient(circle at 35% 30%, rgba(255,255,255,0.50) 0%, rgba(255,255,255,0.14) 20%, transparent 36%),
        radial-gradient(circle at 58% 40%, rgba(255,255,255,0.60) 0%, rgba(255,255,255,0.18) 18%, transparent 34%),
        radial-gradient(circle at 78% 28%, rgba(255,255,255,0.50) 0%, rgba(255,255,255,0.14) 20%, transparent 36%);
      filter: blur(16px);
      animation: moveClouds 30s linear infinite;
    }

    .clouds.second {
      top: 8%;
      opacity: 0.45;
      transform: scale(1.1);
      animation-duration: 44s;
      animation-delay: -12s;
    }

    @keyframes moveClouds {
      from { transform: translateX(0); }
      to   { transform: translateX(-50%); }
    }

    /* =========================
       Soft sunlight glow
    ========================= */
    .sun-glow {
      position: absolute;
      top: -12%;
      right: -10%;
      width: 52%;
      height: 52%;
      z-index: 3;
      pointer-events: none;
      background: radial-gradient(
        circle,
        rgba(255, 230, 160, 0.18),
        rgba(255, 180, 80, 0.07),
        transparent 65%
      );
      animation: glowPulse 4s ease-in-out infinite alternate;
    }

    @keyframes glowPulse {
      from { opacity: 0.25; }
      to   { opacity: 0.50; }
    }

    /* =========================
       Bottom moving dust
    ========================= */
    .dust-layer {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 200%;
      height: 28%;
      z-index: 4;
      pointer-events: none;
      opacity: 0.20;
      background:
        radial-gradient(circle at 12% 70%, rgba(150, 105, 65, 0.38) 0%, transparent 10%),
        radial-gradient(circle at 28% 62%, rgba(180, 130, 80, 0.28) 0%, transparent 12%),
        radial-gradient(circle at 45% 75%, rgba(120, 85, 55, 0.32) 0%, transparent 10%),
        radial-gradient(circle at 68% 65%, rgba(170, 120, 75, 0.28) 0%, transparent 13%),
        radial-gradient(circle at 85% 78%, rgba(130, 90, 55, 0.32) 0%, transparent 12%);
      filter: blur(8px);
      animation: moveDust 11s linear infinite;
    }

    @keyframes moveDust {
      from { transform: translateX(0); }
      to   { transform: translateX(-50%); }
    }

    /* =========================
       Splitting dust effect
       This makes the dust look like
       it bursts and splits outward
       while the rider jumps
    ========================= */
    .split-dust {
      position: absolute;
      left: 63%;
      bottom: 12%;
      width: 34%;
      height: 26%;
      z-index: 5;
      pointer-events: none;
    }

    .split-dust span {
      position: absolute;
      left: 50%;
      bottom: 18%;
      width: 38%;
      height: 18%;
      transform-origin: left center;
      border-radius: 999px;
      filter: blur(8px);
      opacity: 0.55;
      mix-blend-mode: multiply;
    }

    .split-dust .dust1 {
      background: linear-gradient(to right,
        rgba(120, 82, 48, 0.70),
        rgba(171, 120, 74, 0.50),
        rgba(225, 180, 130, 0.00)
      );
      transform: rotate(-32deg);
      animation: splitLeftUpper 2.8s ease-in-out infinite;
    }

    .split-dust .dust2 {
      background: linear-gradient(to right,
        rgba(110, 72, 40, 0.72),
        rgba(165, 112, 68, 0.48),
        rgba(225, 180, 130, 0.00)
      );
      transform: rotate(-10deg);
      animation: splitLeftLower 2.5s ease-in-out infinite;
    }

    .split-dust .dust3 {
      background: linear-gradient(to right,
        rgba(118, 80, 45, 0.72),
        rgba(172, 118, 70, 0.48),
        rgba(225, 180, 130, 0.00)
      );
      transform: rotate(14deg);
      animation: splitRightUpper 2.6s ease-in-out infinite;
    }

    .split-dust .dust4 {
      background: linear-gradient(to right,
        rgba(105, 70, 38, 0.72),
        rgba(160, 108, 65, 0.46),
        rgba(225, 180, 130, 0.00)
      );
      transform: rotate(30deg);
      animation: splitRightLower 2.9s ease-in-out infinite;
    }

    .split-dust .dust5 {
      width: 22%;
      height: 12%;
      background: radial-gradient(circle,
        rgba(135, 90, 55, 0.60) 0%,
        rgba(185, 130, 80, 0.22) 40%,
        transparent 75%
      );
      transform: rotate(0deg);
      animation: dustBurst 2.3s ease-in-out infinite;
      filter: blur(5px);
    }

    @keyframes splitLeftUpper {
      0%   { transform: translate(0,0) rotate(-32deg) scaleX(0.85); opacity: 0.15; }
      25%  { transform: translate(-12px,-10px) rotate(-37deg) scaleX(1.00); opacity: 0.45; }
      50%  { transform: translate(-26px,-16px) rotate(-42deg) scaleX(1.15); opacity: 0.60; }
      75%  { transform: translate(-40px,-22px) rotate(-46deg) scaleX(1.25); opacity: 0.35; }
      100% { transform: translate(-54px,-28px) rotate(-50deg) scaleX(1.35); opacity: 0.00; }
    }

    @keyframes splitLeftLower {
      0%   { transform: translate(0,0) rotate(-10deg) scaleX(0.82); opacity: 0.14; }
      25%  { transform: translate(-10px,-4px) rotate(-14deg) scaleX(0.96); opacity: 0.42; }
      50%  { transform: translate(-22px,-8px) rotate(-18deg) scaleX(1.10); opacity: 0.58; }
      75%  { transform: translate(-34px,-12px) rotate(-22deg) scaleX(1.22); opacity: 0.34; }
      100% { transform: translate(-46px,-15px) rotate(-25deg) scaleX(1.30); opacity: 0.00; }
    }

    @keyframes splitRightUpper {
      0%   { transform: translate(0,0) rotate(14deg) scaleX(0.84); opacity: 0.14; }
      25%  { transform: translate(12px,-6px) rotate(18deg) scaleX(1.00); opacity: 0.44; }
      50%  { transform: translate(26px,-12px) rotate(22deg) scaleX(1.14); opacity: 0.60; }
      75%  { transform: translate(40px,-18px) rotate(26deg) scaleX(1.24); opacity: 0.36; }
      100% { transform: translate(55px,-24px) rotate(30deg) scaleX(1.34); opacity: 0.00; }
    }

    @keyframes splitRightLower {
      0%   { transform: translate(0,0) rotate(30deg) scaleX(0.82); opacity: 0.12; }
      25%  { transform: translate(8px,0px) rotate(34deg) scaleX(0.96); opacity: 0.40; }
      50%  { transform: translate(18px,2px) rotate(38deg) scaleX(1.08); opacity: 0.55; }
      75%  { transform: translate(28px,5px) rotate(42deg) scaleX(1.18); opacity: 0.30; }
      100% { transform: translate(38px,8px) rotate(46deg) scaleX(1.28); opacity: 0.00; }
    }

    @keyframes dustBurst {
      0%   { transform: translate(0,0) scale(0.7); opacity: 0.10; }
      30%  { transform: translate(-8px,-6px) scale(1.0); opacity: 0.35; }
      55%  { transform: translate(-14px,-10px) scale(1.25); opacity: 0.52; }
      80%  { transform: translate(-20px,-14px) scale(1.45); opacity: 0.25; }
      100% { transform: translate(-24px,-16px) scale(1.60); opacity: 0.00; }
    }

    /* =========================
       Small dust particles
    ========================= */
    .dust-particles {
      position: absolute;
      left: 61%;
      bottom: 12%;
      width: 30%;
      height: 22%;
      z-index: 6;
      pointer-events: none;
    }

    .dust-particles i {
      position: absolute;
      display: block;
      width: 10px;
      height: 10px;
      background: rgba(126, 87, 50, 0.45);
      border-radius: 50%;
      filter: blur(1px);
      animation: particleFly 2.7s linear infinite;
    }

    .dust-particles i:nth-child(1) { left: 8%;  bottom: 12%; animation-delay: 0s;   }
    .dust-particles i:nth-child(2) { left: 18%; bottom: 20%; animation-delay: 0.4s; }
    .dust-particles i:nth-child(3) { left: 28%; bottom: 10%; animation-delay: 0.8s; }
    .dust-particles i:nth-child(4) { left: 38%; bottom: 18%; animation-delay: 1.2s; }
    .dust-particles i:nth-child(5) { left: 48%; bottom: 8%;  animation-delay: 1.6s; }
    .dust-particles i:nth-child(6) { left: 60%; bottom: 16%; animation-delay: 2s;   }
    .dust-particles i:nth-child(7) { left: 72%; bottom: 12%; animation-delay: 2.2s; }
    .dust-particles i:nth-child(8) { left: 84%; bottom: 18%; animation-delay: 2.4s; }

    @keyframes particleFly {
      0%   { transform: translate(0, 0) scale(0.6); opacity: 0; }
      15%  { opacity: 0.55; }
      50%  { transform: translate(24px, -16px) scale(1.0); opacity: 0.45; }
      100% { transform: translate(55px, -30px) scale(1.25); opacity: 0; }
    }

    /* =========================
       Facebook button
    ========================= */
    .facebook-button {
      position: absolute;
      left: 27%;
      bottom: 0.9%;
      width: 38%;
      height: 10.5%;
      z-index: 30;

      display: flex;
      justify-content: center;
      align-items: center;

      background: rgba(0, 0, 0, 0.90);
      color: #ffffff;
      text-decoration: none;
      text-align: center;
      text-transform: uppercase;
      font-weight: 900;
      letter-spacing: 2px;
      line-height: 1.1;
      font-size: clamp(20px, 2.2vw, 40px);

      border: 4px solid #ff5a1f;
      border-radius: 24px;

      box-shadow:
        0 0 24px rgba(255, 90, 31, 0.60),
        inset 0 0 14px rgba(255, 90, 31, 0.20);

      transition: all 0.3s ease;
    }

    .facebook-button:hover {
      background: #ff5a1f;
      color: #111;
      transform: scale(1.03);
      box-shadow:
        0 0 30px rgba(255, 90, 31, 0.90),
        inset 0 0 14px rgba(255, 255, 255, 0.18);
    }

    .facebook-button:active {
      transform: scale(0.98);
    }

    @media (max-width: 768px) {
      .cloud-layer {
        opacity: 0.12;
      }

      .facebook-button {
        left: 25%;
        bottom: 1%;
        width: 44%;
        height: 10%;
        font-size: clamp(11px, 2.8vw, 20px);
        border-width: 2px;
        border-radius: 14px;
        letter-spacing: 1px;
      }

      .split-dust {
        left: 61%;
        bottom: 12%;
        width: 34%;
        height: 22%;
      }

      .dust-particles {
        left: 60%;
        bottom: 12%;
        width: 28%;
        height: 20%;
      }
    }
  </style>
</head>
<body>

  <div class="poster-wrapper">

    <!-- Main image -->
    <img
      src="sky-rider.png"
      alt="Newson Sportec Sky Rider"
      class="poster"
    />

    <!-- Moving clouds -->
    <div class="cloud-layer">
      <div class="clouds"></div>
      <div class="clouds second"></div>
    </div>

    <!-- Sun glow -->
    <div class="sun-glow"></div>

    <!-- Bottom dust -->
    <div class="dust-layer"></div>

    <!-- Splitting dust effect -->
    <div class="split-dust">
      <span class="dust1"></span>
      <span class="dust2"></span>
      <span class="dust3"></span>
      <span class="dust4"></span>
      <span class="dust5"></span>
    </div>

    <!-- Small flying particles -->
    <div class="dust-particles">
      <i></i>
      <i></i>
      <i></i>
      <i></i>
      <i></i>
      <i></i>
      <i></i>
      <i></i>
    </div>

    <!-- Facebook button -->
    <a
      class="facebook-button"
      href="https://www.facebook.com/Newsonsportecnews"
      target="_blank"
      rel="noopener noreferrer"
      title="Follow Newson Sportec on Facebook"
    >
      FOLLOW ON<br>FACEBOOK
    </a>

  </div>

</body>
</html>
