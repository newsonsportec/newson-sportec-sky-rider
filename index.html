 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Newson Sportec Sky Rider</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, Helvetica, sans-serif;
      overflow-x: hidden;
    }

    .poster-wrapper {
      position: relative;
      width: 100%;
      max-width: 1600px;
      overflow: hidden;
      background: #000;
    }

    .poster {
      width: 100%;
      display: block;
      position: relative;
      z-index: 1;
      filter: brightness(1.18) contrast(1.12) saturate(1.18);
      transition: transform 0.8s ease, filter 0.8s ease;
    }

    .poster-wrapper:hover .poster {
      transform: scale(1.01);
      filter: brightness(1.22) contrast(1.14) saturate(1.22);
    }

    /* Moving clouds */
    .cloud-layer {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      overflow: hidden;
      opacity: 0.16;
      mix-blend-mode: screen;
    }

    .clouds {
      position: absolute;
      top: 0;
      left: 0;
      width: 220%;
      height: 58%;
      background:
        radial-gradient(circle at 15% 35%, rgba(255,255,255,0.60) 0%, rgba(255,255,255,0.18) 18%, transparent 34%),
        radial-gradient(circle at 35% 30%, rgba(255,255,255,0.50) 0%, rgba(255,255,255,0.14) 20%, transparent 36%),
        radial-gradient(circle at 58% 40%, rgba(255,255,255,0.60) 0%, rgba(255,255,255,0.18) 18%, transparent 34%),
        radial-gradient(circle at 78% 28%, rgba(255,255,255,0.50) 0%, rgba(255,255,255,0.14) 20%, transparent 36%);
      filter: blur(16px);
      animation: moveClouds 30s linear infinite;
    }

    .clouds.second {
      top: 8%;
      opacity: 0.45;
      transform: scale(1.1);
      animation-duration: 44s;
      animation-delay: -12s;
    }

    @keyframes moveClouds {
      from {
        transform: translateX(0);
      }
      to {
        transform: translateX(-50%);
      }
    }

    /* Sun glow */
    .sun-glow {
      position: absolute;
      top: -12%;
      right: -10%;
      width: 52%;
      height: 52%;
      z-index: 3;
      pointer-events: none;
      background: radial-gradient(
        circle,
        rgba(255, 230, 160, 0.18),
        rgba(255, 180, 80, 0.07),
        transparent 65%
      );
      animation: glowPulse 4s ease-in-out infinite alternate;
    }

    @keyframes glowPulse {
      from {
        opacity: 0.25;
      }
      to {
        opacity: 0.50;
      }
    }

    /* Light base dust movement */
    .dust-layer {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 200%;
      height: 28%;
      z-index: 4;
      pointer-events: none;
      opacity: 0.20;
      background:
        radial-gradient(circle at 12% 70%, rgba(150, 105, 65, 0.38) 0%, transparent 10%),
        radial-gradient(circle at 28% 62%, rgba(180, 130, 80, 0.28) 0%, transparent 12%),
        radial-gradient(circle at 45% 75%, rgba(120, 85, 55, 0.32) 0%, transparent 10%),
        radial-gradient(circle at 68% 65%, rgba(170, 120, 75, 0.28) 0%, transparent 13%),
        radial-gradient(circle at 85% 78%, rgba(130, 90, 55, 0.32) 0%, transparent 12%);
      filter: blur(8px);
      animation: moveDust 11s linear infinite;
    }

    @keyframes moveDust {
      from {
        transform: translateX(0);
      }
      to {
        transform: translateX(-50%);
      }
    }

    /*
      SPLITTING DUST BURST
      This is the main effect.
      It sits on the bottom-right dirt area.
    */
    .dust-burst {
      position: absolute;
      right: 5%;
      bottom: 5%;
      width: 38%;
      height: 28%;
      z-index: 8;
      pointer-events: none;
      overflow: visible;
    }

    .dust-burst .core {
      position: absolute;
      right: 4%;
      bottom: 2%;
      width: 55%;
      height: 55%;
      background:
        radial-gradient(circle, rgba(130, 83, 42, 0.42) 0%, rgba(175, 119, 70, 0.22) 35%, transparent 72%);
      filter: blur(16px);
      animation: dustPulse 2.4s ease-in-out infinite;
    }

    @keyframes dustPulse {
      0% {
        transform: scale(0.82);
        opacity: 0.15;
      }
      35% {
        transform: scale(1.06);
        opacity: 0.42;
      }
      70% {
        transform: scale(1.26);
        opacity: 0.18;
      }
      100% {
        transform: scale(1.34);
        opacity: 0;
      }
    }

    /* Several dust split pieces */
    .dust-piece {
      position: absolute;
      bottom: 8%;
      right: 10%;
      width: 28px;
      height: 18px;
      background: rgba(112, 72, 40, 0.55);
      border-radius: 45% 55% 52% 48%;
      filter: blur(1px);
      opacity: 0;
      transform-origin: center center;
    }

    .dust-piece::before {
      content: "";
      position: absolute;
      inset: -40%;
      border-radius: 50%;
      background: rgba(181, 129, 79, 0.22);
      filter: blur(8px);
    }

    .p1 { animation: split1 2.2s linear infinite; }
    .p2 { animation: split2 2.4s linear infinite 0.2s; }
    .p3 { animation: split3 2.1s linear infinite 0.4s; }
    .p4 { animation: split4 2.35s linear infinite 0.1s; }
    .p5 { animation: split5 2.5s linear infinite 0.3s; }
    .p6 { animation: split6 2.25s linear infinite 0.5s; }
    .p7 { animation: split7 2.6s linear infinite 0.15s; }
    .p8 { animation: split8 2.15s linear infinite 0.45s; }
    .p9 { animation: split9 2.45s linear infinite 0.25s; }
    .p10 { animation: split10 2.3s linear infinite 0.6s; }
    .p11 { animation: split11 2.4s linear infinite 0.35s; }
    .p12 { animation: split12 2.55s linear infinite 0.05s; }

    @keyframes split1 {
      0%   { transform: translate(0,0) scale(0.4) rotate(0deg); opacity: 0; }
      10%  { opacity: 0.8; }
      100% { transform: translate(-180px,-90px) scale(1.2) rotate(-35deg); opacity: 0; }
    }
    @keyframes split2 {
      0%   { transform: translate(0,0) scale(0.35) rotate(0deg); opacity: 0; }
      10%  { opacity: 0.75; }
      100% { transform: translate(-140px,-140px) scale(1.1) rotate(28deg); opacity: 0; }
    }
    @keyframes split3 {
      0%   { transform: translate(0,0) scale(0.5) rotate(0deg); opacity: 0; }
      10%  { opacity: 0.7; }
      100% { transform: translate(-90px,-80px) scale(1.25) rotate(-18deg); opacity: 0; }
    }
    @keyframes split4 {
      0%   { transform: translate(0,0) scale(0.45) rotate(0deg); opacity: 0; }
      10%  { opacity: 0.8; }
      100% { transform: translate(-210px,-40px) scale(1.05) rotate(22deg); opacity: 0; }
    }
    @keyframes split5 {
      0%   { transform: translate(0,0) scale(0.4) rotate(0deg); opacity: 0; }
      10%  { opacity: 0.72; }
      100% { transform: translate(-250px,-115px) scale(1.15) rotate(-27deg); opacity: 0; }
    }
    @keyframes split6 {
      0%   { transform: translate(0,0) scale(0.35) rotate(0deg); opacity: 0; }
      10%  { opacity: 0.75; }
      100% { transform: translate(-120px,-35px) scale(0.95) rotate(30deg); opacity: 0; }
    }
    @keyframes split7 {
      0%   { transform: translate(0,0) scale(0.5) rotate(0deg); opacity: 0; }
      10%  { opacity: 0.78; }
      100% { transform: translate(-300px,-130px) scale(1.35) rotate(-32deg); opacity: 0; }
    }
    @keyframes split8 {
      0%   { transform: translate(0,0) scale(0.45) rotate(0deg); opacity: 0; }
      10%  { opacity: 0.68; }
      100% { transform: translate(-160px,-170px) scale(1.05) rotate(18deg); opacity: 0; }
    }
    @keyframes split9 {
      0%   { transform: translate(0,0) scale(0.38) rotate(0deg); opacity: 0; }
      10%  { opacity: 0.8; }
      100% { transform: translate(-260px,-70px) scale(1.1) rotate(-16deg); opacity: 0; }
    }
    @keyframes split10 {
      0%   { transform: translate(0,0) scale(0.42) rotate(0deg); opacity: 0; }
      10%  { opacity: 0.7; }
      100% { transform: translate(-100px,-115px) scale(1.0) rotate(12deg); opacity: 0; }
    }
    @keyframes split11 {
      0%   { transform: translate(0,0) scale(0.36) rotate(0deg); opacity: 0; }
      10%  { opacity: 0.76; }
      100% { transform: translate(-220px,-155px) scale(1.28) rotate(-22deg); opacity: 0; }
    }
    @keyframes split12 {
      0%   { transform: translate(0,0) scale(0.44) rotate(0deg); opacity: 0; }
      10%  { opacity: 0.74; }
      100% { transform: translate(-320px,-55px) scale(1.18) rotate(24deg); opacity: 0; }
    }

    /* Fine dust trail */
    .dust-streak {
      position: absolute;
      right: 8%;
      bottom: 12%;
      width: 52%;
      height: 18%;
      border-radius: 50%;
      background:
        linear-gradient(135deg,
          rgba(190, 140, 90, 0.00) 0%,
          rgba(190, 140, 90, 0.14) 30%,
          rgba(135, 88, 48, 0.28) 55%,
          rgba(110, 70, 38, 0.00) 100%);
      filter: blur(10px);
      transform: rotate(-16deg);
      opacity: 0.4;
      animation: streakMove 2.3s ease-in-out infinite;
    }

    @keyframes streakMove {
      0% {
        transform: translateX(0) rotate(-16deg) scaleX(0.9);
        opacity: 0.18;
      }
      40% {
        transform: translateX(-12px) rotate(-16deg) scaleX(1.05);
        opacity: 0.38;
      }
      100% {
        transform: translateX(-28px) rotate(-16deg) scaleX(1.2);
        opacity: 0;
      }
    }

    /* Facebook button */
    .facebook-button {
      position: absolute;
      left: 27%;
      bottom: 0.9%;
      width: 38%;
      height: 10.5%;
      z-index: 30;

      display: flex;
      justify-content: center;
      align-items: center;

      background: rgba(0, 0, 0, 0.90);
      color: #ffffff;
      text-decoration: none;
      text-align: center;
      text-transform: uppercase;
      font-weight: 900;
      letter-spacing: 2px;
      line-height: 1.1;
      font-size: clamp(20px, 2.2vw, 40px);

      border: 4px solid #ff5a1f;
      border-radius: 24px;

      box-shadow:
        0 0 24px rgba(255, 90, 31, 0.60),
        inset 0 0 14px rgba(255, 90, 31, 0.20);

      transition: all 0.3s ease;
    }

    .facebook-button:hover {
      background: #ff5a1f;
      color: #111;
      transform: scale(1.03);
      box-shadow:
        0 0 30px rgba(255, 90, 31, 0.90),
        inset 0 0 14px rgba(255, 255, 255, 0.18);
    }

    .facebook-button:active {
      transform: scale(0.98);
    }

    @media (max-width: 768px) {
      .cloud-layer {
        opacity: 0.12;
      }

      .dust-burst {
        right: 3%;
        bottom: 6%;
        width: 42%;
        height: 26%;
      }

      .facebook-button {
        left: 26%;
        bottom: 1.0%;
        width: 42%;
        height: 10%;
        font-size: clamp(11px, 2.8vw, 20px);
        border-width: 2px;
        border-radius: 14px;
        letter-spacing: 1px;
      }
    }
  </style>
</head>
<body>

  <div class="poster-wrapper">

    <!-- Main image -->
    <img
      src="sky-rider.png"
      alt="Newson Sportec Sky Rider"
      class="poster"
    />

    <!-- Clouds moving right to left -->
    <div class="cloud-layer">
      <div class="clouds"></div>
      <div class="clouds second"></div>
    </div>

    <!-- Sun glow -->
    <div class="sun-glow"></div>

    <!-- Base dust -->
    <div class="dust-layer"></div>

    <!-- Splitting dust burst -->
    <div class="dust-burst">
      <div class="core"></div>
      <div class="dust-streak"></div>

      <div class="dust-piece p1"></div>
      <div class="dust-piece p2"></div>
      <div class="dust-piece p3"></div>
      <div class="dust-piece p4"></div>
      <div class="dust-piece p5"></div>
      <div class="dust-piece p6"></div>
      <div class="dust-piece p7"></div>
      <div class="dust-piece p8"></div>
      <div class="dust-piece p9"></div>
      <div class="dust-piece p10"></div>
      <div class="dust-piece p11"></div>
      <div class="dust-piece p12"></div>
    </div>

    <!-- Only this button is clickable -->
    <a
      class="facebook-button"
      href="https://www.facebook.com/Newsonsportecnews"
      target="_blank"
      rel="noopener noreferrer"
      title="Follow Newson Sportec on Facebook"
    >
      FOLLOW ON<br>FACEBOOK
    </a>

  </div>

</body>
</html>
