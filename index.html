<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Newson Sportec Sky Rider</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #111;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }

    .poster-wrapper {
      position: relative;
      width: 100%;
      max-width: 1600px;
      overflow: hidden;
      background: #000;
    }

    .poster {
      width: 100%;
      display: block;
      position: relative;
      z-index: 1;
      filter: brightness(1.20) contrast(1.13) saturate(1.20);
      transition: transform 0.8s ease, filter 0.8s ease;
    }

    .poster-wrapper:hover .poster {
      transform: scale(1.01);
      filter: brightness(1.24) contrast(1.15) saturate(1.24);
    }

    /* Moving clouds */
    .cloud-layer {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      opacity: 0.17;
      mix-blend-mode: screen;
      overflow: hidden;
    }

    .clouds {
      position: absolute;
      top: 0;
      left: 0;
      width: 220%;
      height: 58%;
      background:
        radial-gradient(circle at 10% 30%, rgba(255,255,255,0.62) 0%, rgba(255,255,255,0.18) 18%, transparent 36%),
        radial-gradient(circle at 25% 42%, rgba(255,255,255,0.52) 0%, rgba(255,255,255,0.14) 20%, transparent 38%),
        radial-gradient(circle at 43% 28%, rgba(255,255,255,0.58) 0%, rgba(255,255,255,0.16) 18%, transparent 36%),
        radial-gradient(circle at 62% 36%, rgba(255,255,255,0.56) 0%, rgba(255,255,255,0.15) 20%, transparent 38%),
        radial-gradient(circle at 82% 30%, rgba(255,255,255,0.60) 0%, rgba(255,255,255,0.16) 18%, transparent 36%);
      filter: blur(18px);
      animation: moveClouds 28s linear infinite;
    }

    .clouds.second {
      top: 7%;
      opacity: 0.45;
      transform: scale(1.08);
      animation-duration: 40s;
      animation-delay: -8s;
    }

    @keyframes moveClouds {
      from { transform: translateX(0); }
      to   { transform: translateX(-50%); }
    }

    /* Bright sky glow */
    .sun-glow {
      position: absolute;
      top: -10%;
      right: -8%;
      width: 55%;
      height: 55%;
      z-index: 3;
      pointer-events: none;
      background: radial-gradient(
        circle,
        rgba(255, 231, 170, 0.20),
        rgba(255, 180, 70, 0.08),
        transparent 68%
      );
      animation: glowPulse 3.8s ease-in-out infinite alternate;
    }

    @keyframes glowPulse {
      from { opacity: 0.24; }
      to   { opacity: 0.52; }
    }

    /* Ambient lower dust */
    .dust-layer {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 210%;
      height: 30%;
      z-index: 4;
      pointer-events: none;
      opacity: 0.26;
      background:
        radial-gradient(circle at 10% 68%, rgba(135, 95, 58, 0.30) 0%, transparent 11%),
        radial-gradient(circle at 28% 76%, rgba(165, 120, 76, 0.26) 0%, transparent 14%),
        radial-gradient(circle at 50% 70%, rgba(125, 88, 55, 0.30) 0%, transparent 12%),
        radial-gradient(circle at 70% 78%, rgba(170, 120, 78, 0.25) 0%, transparent 13%),
        radial-gradient(circle at 86% 68%, rgba(125, 88, 50, 0.30) 0%, transparent 12%);
      filter: blur(10px);
      animation: moveDust 10s linear infinite;
    }

    @keyframes moveDust {
      from { transform: translateX(0); }
      to   { transform: translateX(-50%); }
    }

    /* Main explosion area */
    .explosion-zone {
      position: absolute;
      right: -2%;
      bottom: 1%;
      width: 55%;
      height: 38%;
      z-index: 10;
      pointer-events: none;
      overflow: visible;
    }

    /* Central violent burst */
    .impact-core,
    .impact-core-2,
    .impact-core-3 {
      position: absolute;
      border-radius: 50%;
      filter: blur(18px);
      opacity: 0;
      mix-blend-mode: screen;
    }

    .impact-core {
      right: 5%;
      bottom: 0%;
      width: 50%;
      height: 50%;
      background: radial-gradient(circle,
        rgba(115, 65, 28, 0.70) 0%,
        rgba(175, 110, 55, 0.42) 30%,
        rgba(255, 155, 60, 0.18) 50%,
        transparent 72%);
      animation: blast1 1.8s ease-out infinite;
    }

    .impact-core-2 {
      right: 10%;
      bottom: 6%;
      width: 36%;
      height: 36%;
      background: radial-gradient(circle,
        rgba(255, 125, 30, 0.30) 0%,
        rgba(255, 165, 60, 0.12) 38%,
        transparent 70%);
      animation: blast2 1.6s ease-out infinite 0.15s;
    }

    .impact-core-3 {
      right: 3%;
      bottom: 2%;
      width: 62%;
      height: 62%;
      background: radial-gradient(circle,
        rgba(140, 88, 44, 0.25) 0%,
        rgba(190, 132, 72, 0.12) 38%,
        transparent 72%);
      animation: blast3 2s ease-out infinite 0.1s;
    }

    @keyframes blast1 {
      0%   { transform: scale(0.55); opacity: 0.10; }
      25%  { transform: scale(0.95); opacity: 0.55; }
      70%  { transform: scale(1.35); opacity: 0.18; }
      100% { transform: scale(1.70); opacity: 0; }
    }

    @keyframes blast2 {
      0%   { transform: scale(0.40); opacity: 0.08; }
      30%  { transform: scale(0.85); opacity: 0.50; }
      80%  { transform: scale(1.50); opacity: 0.12; }
      100% { transform: scale(1.85); opacity: 0; }
    }

    @keyframes blast3 {
      0%   { transform: scale(0.60); opacity: 0.04; }
      35%  { transform: scale(1.00); opacity: 0.28; }
      100% { transform: scale(1.55); opacity: 0; }
    }

    /* Shockwave */
    .shock-ring {
      position: absolute;
      right: 8%;
      bottom: 7%;
      width: 30%;
      height: 22%;
      border-radius: 50%;
      border: 3px solid rgba(255, 170, 70, 0.35);
      filter: blur(3px);
      opacity: 0;
      animation: shockwave 1.5s ease-out infinite;
    }

    @keyframes shockwave {
      0%   { transform: scale(0.4); opacity: 0.10; }
      30%  { opacity: 0.35; }
      100% { transform: scale(2.1); opacity: 0; }
    }

    /* Dust streaks */
    .dust-streak {
      position: absolute;
      border-radius: 50%;
      filter: blur(10px);
      opacity: 0;
    }

    .s1 {
      right: 7%;
      bottom: 16%;
      width: 62%;
      height: 16%;
      background: linear-gradient(135deg,
        rgba(160, 110, 65, 0) 0%,
        rgba(160, 110, 65, 0.16) 24%,
        rgba(112, 75, 42, 0.42) 55%,
        rgba(112, 75, 42, 0) 100%);
      transform: rotate(-20deg);
      animation: streakA 1.8s ease-out infinite;
    }

    .s2 {
      right: 10%;
      bottom: 18%;
      width: 52%;
      height: 14%;
      background: linear-gradient(135deg,
        rgba(200, 145, 92, 0) 0%,
        rgba(200, 145, 92, 0.12) 22%,
        rgba(112, 75, 42, 0.35) 54%,
        rgba(112, 75, 42, 0) 100%);
      transform: rotate(-28deg);
      animation: streakB 1.65s ease-out infinite 0.12s;
    }

    .s3 {
      right: 14%;
      bottom: 12%;
      width: 44%;
      height: 13%;
      background: linear-gradient(135deg,
        rgba(190, 132, 78, 0) 0%,
        rgba(190, 132, 78, 0.11) 24%,
        rgba(108, 70, 38, 0.30) 54%,
        rgba(108, 70, 38, 0) 100%);
      transform: rotate(-8deg);
      animation: streakC 1.9s ease-out infinite 0.22s;
    }

    .s4 {
      right: 3%;
      bottom: 9%;
      width: 48%;
      height: 14%;
      background: linear-gradient(135deg,
        rgba(190, 132, 78, 0) 0%,
        rgba(190, 132, 78, 0.10) 18%,
        rgba(108, 70, 38, 0.28) 55%,
        rgba(108, 70, 38, 0) 100%);
      transform: rotate(-36deg);
      animation: streakD 1.75s ease-out infinite 0.06s;
    }

    @keyframes streakA {
      0%   { transform: translateX(0) rotate(-20deg) scaleX(0.8); opacity: 0.08; }
      35%  { transform: translateX(-18px) rotate(-20deg) scaleX(1.0); opacity: 0.42; }
      100% { transform: translateX(-70px) rotate(-20deg) scaleX(1.34); opacity: 0; }
    }

    @keyframes streakB {
      0%   { transform: translateX(0) rotate(-28deg) scaleX(0.8); opacity: 0.08; }
      35%  { transform: translateX(-14px) rotate(-28deg) scaleX(1.0); opacity: 0.36; }
      100% { transform: translateX(-68px) rotate(-28deg) scaleX(1.26); opacity: 0; }
    }

    @keyframes streakC {
      0%   { transform: translateX(0) rotate(-8deg) scaleX(0.8); opacity: 0.06; }
      35%  { transform: translateX(-10px) rotate(-8deg) scaleX(1.02); opacity: 0.32; }
      100% { transform: translateX(-55px) rotate(-8deg) scaleX(1.20); opacity: 0; }
    }

    @keyframes streakD {
      0%   { transform: translateX(0) rotate(-36deg) scaleX(0.7); opacity: 0.07; }
      40%  { transform: translateX(-16px) rotate(-36deg) scaleX(1.03); opacity: 0.35; }
      100% { transform: translateX(-62px) rotate(-36deg) scaleX(1.28); opacity: 0; }
    }

    /* Dirt particles */
    .dust-piece {
      position: absolute;
      right: 12%;
      bottom: 10%;
      width: var(--size, 18px);
      height: calc(var(--size, 18px) * 0.72);
      background: rgba(112, 72, 40, 0.75);
      border-radius: 45% 55% 52% 48%;
      filter: blur(0.7px);
      opacity: 0;
      transform-origin: center center;
      animation: flyDust var(--dur, 1.9s) linear infinite;
      animation-delay: var(--delay, 0s);
    }

    .dust-piece::before {
      content: "";
      position: absolute;
      inset: -50%;
      border-radius: 50%;
      background: rgba(200, 145, 92, 0.20);
      filter: blur(7px);
    }

    @keyframes flyDust {
      0% {
        transform: translate(0, 0) scale(0.35) rotate(0deg);
        opacity: 0;
      }
      8% {
        opacity: 0.95;
      }
      100% {
        transform: translate(var(--tx), var(--ty)) scale(var(--scale, 1.2)) rotate(var(--rot, 20deg));
        opacity: 0;
      }
    }

    /* Small dust dots */
    .micro-dust {
      position: absolute;
      right: 12%;
      bottom: 11%;
      width: 6px;
      height: 6px;
      background: rgba(175, 122, 70, 0.84);
      border-radius: 50%;
      filter: blur(0.4px);
      opacity: 0;
      animation: flyMicro var(--dur, 1.7s) linear infinite;
      animation-delay: var(--delay, 0s);
    }

    @keyframes flyMicro {
      0% {
        transform: translate(0, 0) scale(0.5);
        opacity: 0;
      }
      10% {
        opacity: 0.88;
      }
      100% {
        transform: translate(var(--tx), var(--ty)) scale(var(--scale, 1.4));
        opacity: 0;
      }
    }

    /* Orange spark glow */
    .spark-glow {
      position: absolute;
      right: 4%;
      bottom: 5%;
      width: 40%;
      height: 28%;
      z-index: 12;
      pointer-events: none;
      background:
        radial-gradient(circle at 65% 70%, rgba(255, 120, 28, 0.28) 0%, rgba(255, 120, 28, 0.12) 20%, transparent 42%),
        radial-gradient(circle at 78% 58%, rgba(255, 185, 70, 0.18) 0%, rgba(255, 185, 70, 0.08) 18%, transparent 42%),
        radial-gradient(circle at 58% 78%, rgba(255, 95, 15, 0.20) 0%, rgba(255, 95, 15, 0.08) 16%, transparent 40%);
      filter: blur(12px);
      mix-blend-mode: screen;
      animation: sparkGlowPulse 1.8s ease-in-out infinite alternate;
    }

    @keyframes sparkGlowPulse {
      from { opacity: 0.35; transform: scale(0.95); }
      to   { opacity: 0.72; transform: scale(1.06); }
    }

    /* Flying orange sparks */
    .spark {
      position: absolute;
      right: 13%;
      bottom: 10%;
      width: var(--w, 16px);
      height: var(--h, 3px);
      border-radius: 999px;
      background: linear-gradient(90deg,
        rgba(255, 255, 170, 0.95) 0%,
        rgba(255, 185, 60, 0.95) 35%,
        rgba(255, 105, 20, 0.85) 75%,
        rgba(255, 105, 20, 0) 100%);
      box-shadow:
        0 0 10px rgba(255, 180, 60, 0.75),
        0 0 18px rgba(255, 110, 20, 0.55);
      opacity: 0;
      filter: blur(0.3px);
      transform-origin: left center;
      animation: flySpark var(--dur, 1.1s) linear infinite;
      animation-delay: var(--delay, 0s);
    }

    @keyframes flySpark {
      0% {
        transform: translate(0, 0) rotate(var(--angle, -20deg)) scaleX(0.4);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      100% {
        transform: translate(var(--tx), var(--ty)) rotate(var(--angle, -20deg)) scaleX(1.15);
        opacity: 0;
      }
    }

    /* Facebook button */
    .facebook-button {
      position: absolute;
      left: 27%;
      bottom: 0.9%;
      width: 38%;
      height: 10.5%;
      z-index: 30;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      text-decoration: none;
      color: #fff;
      background: rgba(0, 0, 0, 0.90);
      border: 4px solid #ff5a1f;
      border-radius: 24px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 2px;
      line-height: 1.1;
      font-size: clamp(20px, 2.2vw, 40px);
      box-shadow:
        0 0 24px rgba(255, 90, 31, 0.65),
        0 0 34px rgba(255, 130, 40, 0.30),
        inset 0 0 14px rgba(255, 90, 31, 0.18);
      transition: all 0.3s ease;
    }

    .facebook-button:hover {
      background: #ff5a1f;
      color: #111;
      transform: scale(1.03);
      box-shadow:
        0 0 30px rgba(255, 90, 31, 0.92),
        0 0 45px rgba(255, 155, 50, 0.42),
        inset 0 0 14px rgba(255, 255, 255, 0.18);
    }

    .facebook-button:active {
      transform: scale(0.98);
    }

    @media (max-width: 768px) {
      .cloud-layer {
        opacity: 0.12;
      }

      .explosion-zone {
        right: -4%;
        bottom: 2%;
        width: 58%;
        height: 34%;
      }

      .facebook-button {
        left: 26%;
        bottom: 1%;
        width: 42%;
        height: 10%;
        font-size: clamp(11px, 2.8vw, 20px);
        border-width: 2px;
        border-radius: 14px;
        letter-spacing: 1px;
      }
    }
  </style>
</head>
